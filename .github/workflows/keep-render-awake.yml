name: Keep Render App Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render application
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 3 \
            --user-agent "sanarei-health-check/1.0" \
            https://sanarei-middleware.onrender.com/health
