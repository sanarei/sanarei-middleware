name: Keep Render App Awake

on:
  schedule:
    - cron: "*/3 * * * *" # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render application
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://sanarei-sample-app.onrender.com/
